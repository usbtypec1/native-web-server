<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Main</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="bg-gray-50 text-gray-800">
  <header class="p-4 shadow-md bg-white flex justify-between items-center">
    <h1 class="text-xl font-bold"><a href="/"><i class="fa-solid fa-comment"></i> Postland</a></h1>
    <nav class="space-x-4 text-sm">
      <a href="/about" class="hover:text-blue-500">About</a>
      <a href="/login" class="hover:text-blue-500">Login</a>
      <a href="/register" class="hover:text-blue-500">Register</a>
    </nav>
  </header>

  <main class="flex flex-col items-center text-center px-6 mt-12 mb-6">
    <h2 class="text-4xl font-bold mb-4">Welcome to Postland</h2>
    <p class="text-gray-600 max-w-xl mb-6">It's the place where everyone can share their thoughts and ideas.</p>
    <a href="/posts/create" class="px-6 py-3 bg-blue-500 text-white rounded-xl shadow hover:bg-blue-600">
      <i class="fa-solid fa-pen"></i> Write a post</a>
    {posts}
  </main>
</body>

</html>
