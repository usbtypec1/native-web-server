<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="bg-gray-50 text-gray-800 flex items-center justify-center h-screen px-4">
  <div class="bg-white p-8 rounded-2xl shadow w-full max-w-md">
    <h2 class="text-2xl font-bold text-center mb-6">Login</h2>

    {errorMessage}

    <form class="space-y-4" method="post">
      <div>
        <label>Username</label>
        <input type="text" class="w-full p-3 border rounded-lg focus:outline-none focus:ring focus:ring-blue-300"
          name="username" autocomplete="username" value="{username}" required />
      </div>
      <div>
        <label>Password</label>
        <input type="password" class="w-full p-3 border rounded-lg focus:outline-none focus:ring focus:ring-blue-300"
          name="password" autocomplete="current-password" required />
      </div>
      <button class="w-full py-3 bg-blue-500 text-white rounded-lg shadow hover:bg-blue-600" type="submit">
        Login
      </button>
    </form>

    <p class="text-center text-sm mt-4">Don't have an account?
      <a href="/register" class="text-blue-500">Register</a>
    </p>
  </div>

  <!-- Small fade-in animation -->
  <style>
    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fade-in 0.25s ease-out;
    }
  </style>

</body>

</html>
