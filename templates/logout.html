<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logout</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="bg-gray-50 text-gray-800 flex items-center justify-center h-screen px-4">

  <div class="bg-white p-8 rounded-2xl shadow w-full max-w-md animate-fade-in">
    <h2 class="text-2xl font-bold text-center mb-6">
      <i class="fa-solid fa-right-from-bracket text-red-500"></i>
      Logout
    </h2>

    <p class="text-center text-gray-600 mb-6">
      Are you sure you want to log out?
    </p>

    <form method="post" class="space-y-4">
      <button
        class="w-full py-3 bg-red-500 text-white rounded-lg shadow hover:bg-red-600 flex items-center justify-center gap-2"
        type="submit">
        <i class="fa-solid fa-power-off"></i>
        Logout
      </button>
    </form>

    <p class="text-center text-sm mt-4">
      <a href="/" class="text-blue-500 hover:underline">
        <i class="fa-solid fa-arrow-left"></i> Back to main page
      </a>
    </p>
  </div>

  <style>
    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fade-in 0.25s ease-out;
    }
  </style>

</body>

</html>
