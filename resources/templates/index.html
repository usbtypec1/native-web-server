<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Main</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="bg-gray-50 text-gray-800">
  {{header}}

  <main class="flex flex-col items-center text-center px-6 mt-12 mb-6">
    <h2 class="text-4xl font-bold mb-4">Welcome to Postland</h2>
    <p class="text-gray-600 max-w-xl mb-6">It's the place where everyone can share their thoughts and ideas.</p>
    <a href="/posts/create" class="px-6 py-3 bg-blue-500 text-white rounded-xl shadow hover:bg-blue-600">
      <i class="fa-solid fa-pen"></i> Write a post</a>

    <div id="postFilterContainer" class="w-full max-w-2xl mt-8">
      <input id="postFilter" type="text" placeholder="Search posts..."
        class="w-full px-4 py-2 border rounded-xl shadow-sm focus:ring-2 focus:ring-blue-400 focus:outline-none" />
    </div>

    {{posts}}
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {

      const filterContainer = document.querySelector("#postFilterContainer");
      if (document.querySelectorAll(".post-item").length === 0) {
        filterContainer.style.display = "none";
      }

      const filterInput = document.querySelector("#postFilter");

      filterInput.addEventListener("input", () => {
        const query = filterInput.value.toLowerCase().trim();
        const posts = document.querySelectorAll(".post-item");

        posts.forEach(post => {
          const title = post.querySelector("h3").textContent.toLowerCase();
          const content = post.querySelector("p").textContent.toLowerCase();

          if (title.includes(query) || content.includes(query)) {
            post.classList.remove("hidden");
          } else {
            post.classList.add("hidden");
          }
        });
      });

    });
  </script>

</body>

</html>
