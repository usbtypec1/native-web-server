<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Error 500</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="bg-gray-50 text-gray-800">

  <header class="p-4 shadow-md bg-white flex justify-between items-center">
    <h1 class="text-xl font-bold"><a href="/"><i class="fa-solid fa-comment"></i> Postland</a></h1>
    <nav class="space-x-4 text-sm">
      <a href="/about" class="hover:text-blue-500">About</a>
      <a href="/login" class="hover:text-blue-500">Login</a>
      <a href="/register" class="hover:text-blue-500">Register</a>
    </nav>
  </header>

  <main class="flex flex-col items-center text-center px-6 mt-12 mb-10">
    <h2 class="text-4xl font-bold mb-4 flex items-center gap-3">
      <i class="fa-solid fa-triangle-exclamation text-red-500"></i> 
      Internal Server Error (500)
    </h2>

    <p class="text-gray-700 text-lg mb-6 max-w-xl">
      Oops! Something went wrong on our side. The server encountered an unexpected problem.
    </p>

    <div class="flex gap-4">
      <a href="/" class="px-6 py-3 bg-blue-500 text-white rounded-xl shadow hover:bg-blue-600">
        <i class="fa-solid fa-house"></i> Go to main page
      </a>

      <a href="javascript:location.reload()" 
        class="px-6 py-3 bg-gray-200 text-gray-800 rounded-xl shadow hover:bg-gray-300">
        <i class="fa-solid fa-rotate-right"></i> Try again
      </a>
    </div>
  </main>

</body>

</html>
